                }

                    s.on("new_message", (msg) => {
                        if (String(msg.conversation_id) === String(id)) {
                            setMessages(prev => {
                                if (prev.find(m => m.id === msg.id)) return prev;
                                return [...prev, {
                                    id: msg.id,
                                    conversation_id: msg.conversation_id,
                                    sender: msg.sender,
                                    text: msg.text || msg.message_text || "",
                                    type: msg.type || "text",
                                    media_url: msg.media_url || null,
                                    created_at: msg.created_at
                                }];
                            });
                        }
                    });
                }
                return () => {
                    const s2 = getSocket();
                    if (s2) s2.off("new_message");
                };
            }, [id]);

            // Auto scroll
            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [messages]);

            const location = useLocation();

            useEffect(() => {
                fetch(`${API_URL}/conversations/${id}/tags`)
                    .then(res => res.json())
                    .then(data => setConvTags(Array.isArray(data) ? data : []))
                    .catch(() => { });
            }, [id, location]);

            // Send text message
            const sendMessage = async () => {
                if (!text.trim() || sending) return;
                const phone = convInfo && convInfo.phone_number;
                if (!phone) { alert("Phone number unknown."); return; }

                const msgText = text;
                setText("");
                setSending(true);
                try {
                    await fetch(`${API_URL}/send-message`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ phone, message: msgText, user_id: user.id })
                    });
                } catch (err) {
                    alert("Failed to send message.");
                    setText(msgText);
                }
                setSending(false);
            };

            // Send media file
            const sendFile = async (file) => {
                const phone = convInfo && convInfo.phone_number;
                if (!phone || !file) return;

                const formData = new FormData();
                formData.append("phone", phone);
                formData.append("media", file);
                formData.append("user_id", user.id);

                try {
                    await fetch(`${API_URL}/send-message`, {
                        method: "POST",
                        body: formData
                    });
                } catch (err) {
                    alert("Failed to send file.");
                }
                setShowAttach(false);
            };

            // Update conversation status
            const updateStatus = async (newStatus) => {
                setStatusUpdating(true);
                try {
                    await fetch(`${API_URL}/conversations/${id}/status`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: newStatus })
                    });
                    setConvInfo(prev => ({ ...prev, status: newStatus }));
                } catch (err) {
                    alert("Status update failed.");
                }
                setStatusUpdating(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const displayName = (convInfo && convInfo.name) || (convInfo && convInfo.phone_number) || "Loading...";
            const displayStatus = (convInfo && convInfo.status) || "Open";

            const statusColor = (s) => {
                if (s.toLowerCase() === 'solved') return 'bg-blue-100 text-blue-700';
                if (s.toLowerCase() === 'pending') return 'bg-orange-100 text-orange-700';
                return 'bg-green-100 text-green-800';

            return (

                            <button onClick={() => navigate(-1)}>
                                <span className="material-symbols-outlined text-gray-600">arrow_back_ios</span>
                            </button>
                            <div className="flex items-center gap-3">
                                <div className="relative">
                                    {convInfo && convInfo.avatar_url ? (
                                        <img src={convInfo.avatar_url} className="w-10 h-10 rounded-full object-cover" alt={displayName} />
                                    ) : (
                                        <div className="w-10 h-10 rounded-full bg-[#dcf8ef] flex items-center justify-center text-primary font-bold text-lg">
                                            {displayName ? displayName[0].toUpperCase() : "?"}

                                    )}
                                    <div className="absolute bottom-0 right-0 bg-white rounded-full p-0.5">
                                        <div className="w-4 h-4 bg-green-500 rounded-full border-2 border-white"></div>
                                    </div>
                                </div>
                                <div
                                    onClick={() => convInfo && navigate(`/contact-details/${convInfo.contact_id || ''}`)}
                                    className="cursor-pointer"
                                >
                                    <h1 className="font-semibold text-on-surface">{displayName}</h1>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${statusColor(displayStatus)}`}>
                                        {displayStatus}
                                    </span>
                                    {convTags.length > 0 && (
                                        <div className="flex gap-1 mt-0.5 flex-wrap">
                                            {convTags.map(tag => (
                                                <span
                                                    key={tag.id}
                                                    style={{ backgroundColor: tag.color + "20", color: tag.color }}
                                                    className="text-[9px] font-bold px-1.5 py-0.5 rounded-full"
                                                >
                                                    {tag.name}
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Header Actions */}
                        <div className="flex items-center gap-3">
                            {/* Quick Status Change */}
                            <select
                                value={displayStatus}
                                onChange={(e) => updateStatus(e.target.value)}
                                disabled={statusUpdating}
                                className="text-[10px] font-bold border-none bg-transparent text-primary focus:ring-0 cursor-pointer"
                            >
                                <option value="Open">Open</option>
                                <option value="Pending">Pending</option>
                                <option value="Solved">Solved</option>
                            </select>
                            <Link to={`/chat-options/${id}`}>
                                <span className="material-symbols-outlined text-gray-500">more_horiz</span>
                            </Link>
                        </div>
                    </header>

                    {/* Messages */}
                    <main className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
                        {/* Phone number divider */}
                        <div className="relative flex items-center justify-center mb-2">
                            <div className="absolute w-full border-t border-gray-200"></div>
                            <span className="relative bg-[#f7f8f9] px-4 text-[11px] text-gray-400 text-center">
                                {(convInfo && convInfo.phone_number) || ""}
                            </span>
                        </div>

                        {messages.length === 0 && (
                            <div className="flex flex-col items-center justify-center py-16 text-gray-400">
                                <span className="material-symbols-outlined text-4xl mb-2 opacity-30">chat</span>
                                <p className="text-sm opacity-50">{t('noConversations')}</p>
                            </div>
                        )}

                        {messages.map((msg, i) => {
                            const isOutbound = msg.sender === 'agent';
                            return (
                                <div key={msg.id || i} className={`flex ${isOutbound ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-xl max-w-[80%] ${isOutbound
                                        ? 'bg-[#dcf8c6] text-on-surface rounded-br-none'
                                        : 'bg-white text-on-surface shadow-sm rounded-bl-none'
                                        }`}>
                                        {/* Image */}
                                        {msg.media_url && msg.type === 'image' && (
                                            <img
                                                src={`${API_URL}${msg.media_url}`}
                                                className="rounded-lg mb-2 max-w-full cursor-pointer"
                                                alt="media"
                                                onClick={() => window.open(`${API_URL}${msg.media_url}`, '_blank')}
                                            />
                                        )}
                                        {/* Audio */}
                                        {msg.media_url && msg.type === 'audio' && (
                                            <audio controls src={`${API_URL}${msg.media_url}`} className="mb-2 w-full" />
                                        )}
                                        {/* Video */}
                                        {msg.media_url && msg.type === 'video' && (
                                            <video controls src={`${API_URL}${msg.media_url}`} className="rounded-lg mb-2 max-w-full" />
                                        )}
                                        {/* Document */}
                                        {msg.media_url && msg.type === 'document' && (
                                            <a
                                                href={`${API_URL}${msg.media_url}`}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="flex items-center gap-2 text-primary text-sm mb-2 bg-primary/5 px-3 py-2 rounded-lg"
                                            >
                                                <span className="material-symbols-outlined text-sm">description</span>
                                                {msg.text || "Document"}
                                            </a>
                                        )}
                                        {/* Text */}
                                        {(!msg.media_url || msg.type === 'text') && (
                                            <p className="text-sm">{msg.text || msg.message_text || ""}</p>
                                        )}
                                        {/* Time + tick */}
                                        <p className="text-[10px] text-gray-400 mt-1 text-right flex items-center justify-end gap-1">
                                            {formatTime(msg.created_at)}
                                            {isOutbound && (
                                                <span className="material-symbols-outlined text-[12px] text-blue-400" style={{ fontVariationSettings: "'FILL' 1" }}>done_all</span>
                                            )}
                                        </p>
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={messagesEndRef} />
                    </main>

                    {/* Attach Options */}
                    {showAttach && (
                        <div className="bg-white border-t border-gray-100 px-4 py-3 grid grid-cols-4 gap-3">
                            {[
                                { label: 'Image', icon: 'image', accept: 'image/*', color: 'bg-purple-100 text-purple-600' },
                                { label: 'Video', icon: 'videocam', accept: 'video/*', color: 'bg-red-100 text-red-600' },
                                { label: 'Audio', icon: 'mic', accept: 'audio/*', color: 'bg-yellow-100 text-yellow-600' },

                                <button

                                        fileInputRef.current.click();

                                    className="flex flex-col items-center gap-1"
                                >
                                    <div className={`w-12 h-12 rounded-full ${item.color} flex items-center justify-center`}>
                                        <span className="material-symbols-outlined">{item.icon}</span>
                                    </div>
                                    <span className="text-[10px] font-medium text-on-surface-variant">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Hidden file input */}
                    <input
                        ref={fileInputRef}
                        type="file"
                        className="hidden"
                        onChange={(e) => {
                            if (e.target.files[0]) sendFile(e.target.files[0]);
                        }}
                    />

                    {/* Footer */}
                    <footer className="bg-surface-container-low p-3 space-y-2">
                        <div className="bg-white rounded-lg p-2 flex justify-between items-center text-xs">
                            <div className="flex items-center gap-2 text-on-surface">
                                <span className="material-symbols-outlined text-gray-400 text-lg">reply</span>
                                <span className="font-medium">Default</span>
                            </div>
                            <span className="text-gray-500 text-[10px]">{(convInfo && convInfo.phone_number) || ""}</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setShowAttach(!showAttach)}
                                className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl transition-colors ${showAttach ? 'bg-primary text-white' : 'bg-gray-200 text-gray-600'}`}
                            >
                                <span className="material-symbols-outlined text-xl">{showAttach ? 'close' : 'attach_file'}</span>
                            </button>
                            <div className="flex-1 bg-white rounded-full px-4 py-2 border border-gray-100">
                                <input
                                    className="w-full bg-transparent border-none text-sm placeholder:text-gray-400 focus:ring-0"
                                    placeholder={t('typeMessage')}
                                    value={text}
                                    onChange={(e) => setText(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                />
                            </div>
                            <button
                                onClick={sendMessage}
                                disabled={sending || !text.trim()}
                                className="bg-primary-container text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform disabled:opacity-50"
                            >
                                <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>send</span>
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

            const [history, setHistory] = useState([]);

            const loadHistory = () => {
                if (!user.id) return;
                fetch(`${API_URL}/broadcasts?user_id=${user.id}`)
                    .then(res => res.json())
                    .then(data => setHistory(Array.isArray(data) ? data : []))
                    .catch(() => setHistory([]));

            useEffect(() => {
                loadHistory();
            }, []);

            const user = JSON.parse(localStorage.getItem("user") || "{}");

            // Jab modal khule, eligible contacts count nikal lo

                    fetch(`${API_URL}/api/contacts?user_id=${user.id}`)
                        .then(res => res.json())
                        .then(data => {
                            const list = Array.isArray(data) ? data : [];
                            const eligible = list.filter(c => c.allow_broadcast !== false);
                            setEligibleCount({ total: list.length, eligible: eligible.length });
                        })
                        .catch(() => setEligibleCount(null));

            const handleSendBroadcast = async () => {

                        method: "POST",

                    });
                    const data = await res.json();
                    if (res.ok) {
                        setResult(data);
                        loadHistory();
                        setBroadcastMsg("");
                    } else {
                        alert(data.error || "Broadcast failed");

                    alert("Server error");

                        >
                            <div className="text-left">
                                <p className="font-bold text-lg">{t('newBroadcast')}</p>
                                <p className="text-xs opacity-90">Send a message to eligible contacts</p>
                            </div>
                            <span className="material-symbols-outlined text-3xl">campaign</span>
                        </button>

                        {result && (
                            <div className="bg-white border border-gray-100 rounded-2xl p-5 mb-6 space-y-2">
                                <h3 className="font-bold text-sm">Last Broadcast Result</h3>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-green-50 rounded-xl p-3">
                                        <p className="text-lg font-bold text-green-600">{result.sent_count}</p>

            const getFullPhone = () => {
                const digits = phone.replace(/\D/g, "");
                return selectedCountry.dial.replace("+", "") + digits;
            };

            const isValid = () => {
                const digits = phone.replace(/\D/g, "");
                return digits.length >= selectedCountry.digits;
            };

            const handleSave = async () => {
                if (!isValid()) {
                    setError(`Enter a valid ${selectedCountry.digits}-digit number`);
                    return;
                }
                setLoading(true);
                setError("");
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                const fullPhone = getFullPhone();
                try {
                    const res = await fetch(`${API_URL}/api/contacts`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            name: name.trim() || fullPhone,
                            phone: fullPhone,
                            allow_broadcast: allowBroadcast,
                            allow_sms: true,
                            user_id: user.id
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        navigate(-1);
                    } else {
                        setError(data.error || "Failed to save contact");
                    }
                } catch (err) {
                    setError("Server error. Please try again.");
                }
                setLoading(false);
            };

            const handleSendMessage = async () => {
                if (!isValid()) {
                    setError(`Enter a valid ${selectedCountry.digits}-digit number`);
                    return;
                }
                setSending(true);
                setError("");
                const user = JSON.parse(localStorage.getItem("user") || "{}");

                        method: "POST",
                        headers: { "Content-Type": "application/json" },

                        navigate("/inbox");

                        setError(data.error || "Could not start conversation");

                    setError("Server error. Please try again.");

                                    </button>
                                    {/* Phone input */}

                                        onChange={(e) => setPhone(e.target.value)}
                                        type="tel"
                                    />
                                </div>

                                {/* Country picker dropdown */}
                                {showCountryPicker && (

                                        {COUNTRIES.map(country => (

                            </button>
                        </div>
                    </div>

        const AssignTeamScreen = () => {

            const params = useParams();

            const [teams, setTeams] = useState([]);
            const [loading, setLoading] = useState(true);
            const [assigning, setAssigning] = useState(null);
            const [currentTeam, setCurrentTeam] = useState(null);
            const [success, setSuccess] = useState("");
            const [showCreate, setShowCreate] = useState(false);
            const [newTeamName, setNewTeamName] = useState("");
            const [newTeamDesc, setNewTeamDesc] = useState("");
            const [creating, setCreating] = useState(false);
            const [createError, setCreateError] = useState("");

            const user = JSON.parse(localStorage.getItem("user") || "{}");

            const loadData = () => {
                // Load all teams
                fetch(`${API_URL}/api/teams`)
                    .then(res => res.json())
                    .then(data => {
                        setTeams(Array.isArray(data) ? data : []);
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));

                // Load current conversation team
                if (convId) {
                    fetch(`${API_URL}/conversations/${convId}`)
                        .then(res => res.json())
                        .then(data => setCurrentTeam(data.team_id || null))
                        .catch(() => { });
                }
            };

            useEffect(() => {
                loadData();
            }, [convId]);

            const handleAssignTeam = async (teamId, teamName) => {
                setAssigning(teamId);
                setSuccess("");
                try {
                    const res = await fetch(`${API_URL}/conversations/${convId}/team`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ team_id: teamId })
                    });
                    if (res.ok) {
                        setCurrentTeam(teamId);
                        setSuccess(`Assigned to ${teamName}`);
                        setTimeout(() => navigate(-1), 1000);
                    }
                } catch (err) {
                    alert("Assignment failed. Try again.");
                }
                setAssigning(null);
            };

            const handleUnassign = async () => {
                setAssigning("unassign");
                try {
                    const res = await fetch(`${API_URL}/conversations/${convId}/team`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ team_id: null })
                    });
                    if (res.ok) {
                        setCurrentTeam(null);
                        setSuccess("Team unassigned");
                        setTimeout(() => navigate(-1), 1000);
                    }
                } catch (err) {
                    alert("Failed. Try again.");
                }
                setAssigning(null);
            };

            const handleCreateTeam = async () => {
                if (!newTeamName.trim()) {
                    setCreateError("Team name is required");
                    return;
                }
                setCreating(true);
                setCreateError("");
                try {
                    const res = await fetch(`${API_URL}/api/teams`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            name: newTeamName.trim(),
                            description: newTeamDesc.trim(),
                            user_id: user.id
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setNewTeamName("");
                        setNewTeamDesc("");
                        setShowCreate(false);
                        loadData();
                    } else {
                        setCreateError(data.error || "Failed to create team");
                    }
                } catch (err) {
                    setCreateError("Server error. Try again.");
                }
                setCreating(false);
            };

            const handleDeleteTeam = async (teamId, teamName) => {
                if (!window.confirm(`Delete "${teamName}" team?`)) return;
                try {
                    await fetch(`${API_URL}/api/teams/${teamId}`, { method: "DELETE" });
                    if (currentTeam === teamId) setCurrentTeam(null);
                    loadData();

                    alert("Delete failed.");

            const currentTeamData = teams.find(t => t.id === currentTeam);

                            <button onClick={() => navigate(-1)} className="flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100">
                                <span className="material-symbols-outlined text-primary">arrow_back</span>
                            </button>
                            <h1 className="font-bold text-lg text-primary">{t('assignTeam')}</h1>
                        </div>
                        <button
                            onClick={() => { setShowCreate(!showCreate); setCreateError(""); }}
                            className="flex items-center gap-1 text-xs font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-full"

                            <span className="material-symbols-outlined text-sm">add</span>
                            {t('newTeam')}
                        </button>

                    <main className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-4">

                                        {createError}
                                    </div>

                                    className="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm"
                                    placeholder={t('teamName')}
                                    value={newTeamName}
                                    onChange={(e) => setNewTeamName(e.target.value)}
                                />
                                <input
                                    className="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm"
                                    placeholder={t('description')}
                                    value={newTeamDesc}
                                    onChange={(e) => setNewTeamDesc(e.target.value)}
                                />
                                <div className="flex gap-2">
                                    <button
                                        onClick={handleCreateTeam}
                                        disabled={creating}
                                        className="flex-1 py-3 bg-primary text-white font-bold rounded-xl text-sm disabled:opacity-60"
                                    >
                                        {creating ? t('creating') : t('createNewTeam')}
                                    </button>
                                    <button
                                        onClick={() => setShowCreate(false)}
                                        className="px-4 py-3 bg-gray-100 text-gray-600 font-medium rounded-xl text-sm"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Current Team */}
                        {currentTeamData && (
                            <div className="bg-primary/5 border border-primary/20 rounded-2xl p-4 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center">
                                        <span className="material-symbols-outlined text-primary text-sm">groups</span>
                                    </div>
                                    <div>
                                        <p className="text-[10px] text-gray-400">{t('currentlyAssigned')}</p>
                                        <p className="font-bold text-sm text-on-surface">{currentTeamData.name}</p>
                                        {currentTeamData.description && (
                                            <p className="text-[10px] text-gray-400">{currentTeamData.description}</p>
                                        )}
                                    </div>
                                </div>
                                <button
                                    onClick={handleUnassign}
                                    disabled={assigning === "unassign"}
                                    className="text-xs text-red-500 font-bold px-3 py-1.5 bg-red-50 rounded-lg"
                                >
                                    {assigning === "unassign" ? "..." : t('unassign')}
                                </button>
                            </div>
                        )}

                        {/* Success Message */}
                        {success && (
                            <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2">
                                <span className="material-symbols-outlined text-sm">check_circle</span>
                                {success}
                            </div>
                        )}

                            {t('selectTeam')}

                                <p className="text-gray-400 text-sm">{t('loadingTeams')}</p>

                                <span className="material-symbols-outlined text-4xl text-gray-300">groups</span>
                                <p className="text-gray-400 text-sm">{t('noTeamsFound')}</p>
                                <p className="text-gray-300 text-xs">{t('createTeamHint')}</p>
                            </div>
                        )}

                        {teams.map((team) => {
                            const isAssigned = currentTeam === team.id;
                            const isLoading = assigning === team.id;

                            return (
                                <div
                                    key={team.id}
                                    className={`w-full flex items-center justify-between p-4 rounded-2xl border transition-all ${isAssigned
                                        ? 'bg-primary/5 border-primary/30'
                                        : 'bg-white border-gray-100'
                                        }`}
                                >
                                    <button
                                        onClick={() => !isAssigned && handleAssignTeam(team.id, team.name)}
                                        disabled={isLoading || isAssigned}
                                        className="flex items-center gap-3 flex-1 text-left"
                                    >
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${isAssigned ? 'bg-primary' : 'bg-gray-100'
                                            }`}>
                                            <span className={`material-symbols-outlined text-sm ${isAssigned ? 'text-white' : 'text-gray-500'
                                                }`}>groups</span>
                                        </div>
                                        <div>
                                            <p className="font-semibold text-sm text-on-surface">{team.name}</p>
                                            {team.description && (
                                                <p className="text-[10px] text-gray-400">{team.description}</p>
                                            )}
                                        </div>
                                    </button>

                                    <div className="flex items-center gap-2">
                                        {isAssigned && (
                                            <span className="text-[10px] font-bold text-primary bg-primary/10 px-2 py-1 rounded-full">
                                                Assigned
                                            </span>
                                        )}
                                        {isLoading && (
                                            <span className="text-[10px] text-gray-400">{t('assigning')}</span>
                                        )}
                                        <button
                                            onClick={() => handleDeleteTeam(team.id, team.name)}
                                            className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50"
                                        >
                                            <span className="material-symbols-outlined text-red-400 text-sm">delete</span>
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </main>
                </div>
            );
        };

        const SubmitAsScreen = () => {
            const navigate = useNavigate();
            const params = useParams();
            const convId = params.id;
            const [submitting, setSubmitting] = useState(null);
            const [success, setSuccess] = useState("");

            const handleSubmit = async (status) => {
                setSubmitting(status);
                setSuccess("");
                try {
                    const res = await fetch(`${API_URL}/conversations/${convId}/status`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status })
                    });
                    if (res.ok) {
                        setSuccess(`Marked as ${status}`);
                        setTimeout(() => navigate(-2), 1000);
                    } else {
                        alert("Failed to update status");
                    }
                } catch (err) {
                    alert("Server error. Try again.");
                }
                setSubmitting(null);
            };

            const options = [
                { l: t('resolved'), status: 'Solved', c: 'text-green-600', bg: 'bg-green-50', i: 'check_circle', desc: t('markResolved') },
                { l: t('pending'), status: 'Pending', c: 'text-orange-500', bg: 'bg-orange-50', i: 'schedule', desc: t('markPending') },
                { l: t('spam'), status: 'Spam', c: 'text-red-500', bg: 'bg-red-50', i: 'report', desc: t('markSpam') }
            ];

            return (
                <div className="absolute inset-0 bg-surface flex flex-col animate-slide-up z-[60]">
                    <header className="px-6 h-16 flex items-center gap-4 sticky top-0 bg-[#f3fcef]/80 backdrop-blur-md z-50 border-b border-gray-100">
                        <button onClick={() => navigate(-1)} className="flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100">
                            <span className="material-symbols-outlined text-primary">arrow_back</span>
                        </button>
                        <h1 className="font-bold text-lg text-primary">{t('submitAs')}</h1>
                    </header>

                    <main className="flex-1 p-6 space-y-4">
                        {success && (
                            <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2">
                                <span className="material-symbols-outlined text-sm">check_circle</span>
                                {success}
                            </div>
                        )}

                        <p className="text-sm text-gray-400 pb-2">
                            {t('selectClose')}
                        </p>

                        {options.map((opt) => (
                            <button
                                key={opt.l}
                                onClick={() => handleSubmit(opt.status)}
                                disabled={submitting === opt.status}
                                className={`w-full flex items-center gap-4 p-5 bg-white rounded-2xl border border-gray-100 active:scale-95 transition-all disabled:opacity-60`}
                            >
                                <div className={`w-12 h-12 rounded-full ${opt.bg} flex items-center justify-center flex-shrink-0`}>
                                    <span className={`material-symbols-outlined ${opt.c}`} style={{ fontVariationSettings: "'FILL' 1" }}>
                                        {opt.i}
                                    </span>
                                </div>
                                <div className="text-left flex-1">
                                    <p className={`font-bold text-sm ${opt.c}`}>{opt.l}</p>
                                    <p className="text-[10px] text-gray-400">{opt.desc}</p>
                                </div>
                                {submitting === opt.status ? (
                                    <span className="text-xs text-gray-400">{t('saving')}</span>
                                ) : (
                                    <span className="material-symbols-outlined text-gray-300">chevron_right</span>
                                )}
                            </button>
                        ))}
                    </main>
                </div>
            );
        };

        const ViewTagsScreen = () => {
            const navigate = useNavigate();
            const params = useParams();
            const convId = params.id;

            const [allTags, setAllTags] = useState([]);
            const [convTags, setConvTags] = useState([]);
            const [newTagName, setNewTagName] = useState("");
            const [creating, setCreating] = useState(false);
            const [createError, setCreateError] = useState("");
            const [loading, setLoading] = useState(true);

            const user = JSON.parse(localStorage.getItem("user") || "{}");

            const TAG_COLORS = [
                { label: "Green", value: "#006d2f" },
                { label: "Blue", value: "#1565c0" },
                { label: "Red", value: "#c62828" },
                { label: "Orange", value: "#e65100" },
                { label: "Purple", value: "#6a1b9a" },
            ];
            const [selectedColor, setSelectedColor] = useState(TAG_COLORS[0].value);

            const loadData = async () => {
                setLoading(true);
                try {
                    const [allRes, convRes] = await Promise.all([
                        fetch(`${API_URL}/api/tags`),
                        fetch(`${API_URL}/conversations/${convId}/tags`)
                    ]);
                    const allData = await allRes.json();
                    const convData = await convRes.json();
                    setAllTags(Array.isArray(allData) ? allData : []);
                    setConvTags(Array.isArray(convData) ? convData.map(t => t.id) : []);
                } catch (err) {
                    console.error("Tags load error:", err);
                }
                setLoading(false);
            };

            useEffect(() => {
                if (convId) loadData();
            }, [convId]);

            const handleToggleTag = async (tagId) => {
                try {
                    await fetch(`${API_URL}/conversations/${convId}/tags`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ tag_id: tagId })
                    });
                    setConvTags(prev =>
                        prev.includes(tagId) ? prev.filter(id => id !== tagId) : [...prev, tagId]
                    );
                } catch (err) {
                    alert("Tag toggle failed");
                }
            };

            const handleCreateTag = async () => {
                if (!newTagName.trim()) {
                    setCreateError("Tag name required");
                    return;
                }
                setCreating(true);
                setCreateError("");
                try {
                    const res = await fetch(`${API_URL}/api/tags`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            name: newTagName.trim(),
                            color: selectedColor,
                            user_id: user.id
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setNewTagName("");
                        setSelectedColor(TAG_COLORS[0].value);
                        loadData();
                    } else {
                        setCreateError(data.error || "Failed to create tag");
                    }
                } catch (err) {
                    setCreateError("Server error");
                }
                setCreating(false);
            };

            const handleDeleteTag = async (tagId, tagName) => {
                if (!window.confirm(`Delete "${tagName}" tag?`)) return;
                try {
                    await fetch(`${API_URL}/api/tags/${tagId}`, { method: "DELETE" });
                    loadData();
                } catch (err) {
                    alert("Delete failed");
                }
            };

            const appliedTags = allTags.filter(t => convTags.includes(t.id));

            return (
                <div className="absolute inset-0 bg-surface flex flex-col z-[70] animate-slide-up">
                    <header className="px-6 h-16 flex items-center gap-4 bg-[#f3fcef]/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
                        <button onClick={() => navigate(-1)} className="text-primary flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100">
                            <span className="material-symbols-outlined">arrow_back</span>
                        </button>
                        <h1 className="font-bold text-lg text-primary">{t('convTags')}</h1>
                    </header>

                    <main className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6">

                        {/* Applied tags on this conversation */}
                        <section>
                            <h3 className="text-xs font-bold uppercase text-gray-400 tracking-widest mb-3">{t('appliedTags')}</h3>
                            {appliedTags.length === 0 ? (
                                <p className="text-sm text-gray-400">{t('noTagsApplied')}</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {appliedTags.map(tag => (
                                        <span
                                            key={tag.id}
                                            onClick={() => handleToggleTag(tag.id)}
                                            style={{ backgroundColor: tag.color + "20", color: tag.color, borderColor: tag.color + "40" }}
                                            className="px-3 py-1.5 rounded-full text-xs font-bold border cursor-pointer flex items-center gap-1"
                                        >
                                            {tag.name}
                                            <span className="material-symbols-outlined text-[12px]">close</span>
                                        </span>
                                    ))}
                                </div>
                            )}
                        </section>

                        {/* All available tags */}
                        <section>
                            <h3 className="text-xs font-bold uppercase text-gray-400 tracking-widest mb-3">{t('allTags')}</h3>
                            {loading ? (
                                <p className="text-sm text-gray-400">{t('loadingTags')}</p>
                            ) : allTags.length === 0 ? (
                                <p className="text-sm text-gray-400">{t('noTagsCreated')}</p>
                            ) : (
                                <div className="space-y-2">
                                    {allTags.map(tag => {
                                        const isApplied = convTags.includes(tag.id);
                                        return (
                                            <div
                                                key={tag.id}
                                                className={`flex items-center justify-between p-3 rounded-xl border transition-all ${isApplied ? 'bg-primary/5 border-primary/20' : 'bg-white border-gray-100'
                                                    }`}
                                            >
                                                <button
                                                    onClick={() => handleToggleTag(tag.id)}
                                                    className="flex items-center gap-3 flex-1 text-left"
                                                >
                                                    <div
                                                        className="w-3 h-3 rounded-full flex-shrink-0"
                                                        style={{ backgroundColor: tag.color }}
                                                    ></div>
                                                    <span className="font-semibold text-sm text-on-surface">{tag.name}</span>
                                                    {isApplied && (
                                                        <span className="text-[10px] font-bold text-primary bg-primary/10 px-2 py-0.5 rounded-full">
                                                            Applied ✓
                                                        </span>
                                                    )}
                                                </button>
                                                <button
                                                    onClick={() => handleDeleteTag(tag.id, tag.name)}
                                                    className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-red-50 ml-2"
                                                >
                                                    <span className="material-symbols-outlined text-red-400 text-sm">delete</span>
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>

                        {/* Create new tag */}
                        <section className="bg-white border border-gray-100 rounded-2xl p-4 space-y-3">
                            <h3 className="font-bold text-sm">{t('createNewTag')}</h3>
                            {createError && (
                                <div className="bg-red-50 text-red-600 px-3 py-2 rounded-xl text-xs">{createError}</div>
                            )}
                            <input
                                className="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm"
                                placeholder={t('tagNamePlaceholder')}
                                value={newTagName}
                                onChange={(e) => setNewTagName(e.target.value)}
                                onKeyDown={(e) => e.key === "Enter" && handleCreateTag()}
                            />
                            {/* Color picker */}
                            <div className="flex gap-2 items-center">
                                <span className="text-xs text-gray-400 font-medium">Color:</span>
                                {TAG_COLORS.map(c => (
                                    <button
                                        key={c.value}
                                        onClick={() => setSelectedColor(c.value)}
                                        className="w-6 h-6 rounded-full border-2 transition-all"
                                        style={{
                                            backgroundColor: c.value,
                                            borderColor: selectedColor === c.value ? '#000' : 'transparent',
                                            transform: selectedColor === c.value ? 'scale(1.2)' : 'scale(1)'
                                        }}
                                    />
                                ))}
                            </div>
                            <button
                                onClick={handleCreateTag}
                                disabled={creating || !newTagName.trim()}
                                className="w-full py-3 bg-primary text-white font-bold rounded-xl text-sm disabled:opacity-60"
                            >
                                {creating ? t('creating') : t('createTag')}
                            </button>
                        </section>
                    </main>
                </div>
            );
        };

        const SortOverlay = () => {
            const navigate = useNavigate();
            return (
                <div
                    className="absolute inset-0 z-[100] bg-black/40 backdrop-blur-[2px] flex items-center justify-center p-6"
                    onClick={(e) => { if (e.target === e.currentTarget) navigate(-1); }}
                >
                    <div className="w-full bg-white rounded-3xl p-6 space-y-6 shadow-2xl animate-slide-up">
                        <div className="flex items-center justify-between">
                            <h2 className="text-xl font-bold">Sort Contacts</h2>
                            <button onClick={() => navigate(-1)} className="text-gray-400">
                                <span className="material-symbols-outlined">close</span>
                            </button>
                        </div>
                        <div className="space-y-2">
                            {['Name (A-Z)', 'Last Updated', 'Created Date'].map((o, i) => (
                                <button key={i} onClick={() => navigate(-1)} className={`w-full flex justify-between items-center p-4 border rounded-xl transition-colors ${i === 1 ? 'border-primary-container bg-primary-container/5' : 'border-gray-100'}`}>
                                    <span className={i === 1 ? 'font-bold text-primary' : 'text-on-surface'}>{o}</span>
                                    {i === 1 && <span className="material-symbols-outlined text-primary-container">check_circle</span>}
                                </button>
                            ))}
                        </div>
                        <button
                            onClick={() => navigate(-1)}
                            className="w-full text-gray-500 font-medium text-center py-2"
                        >
                            {t('cancel')}
                        </button>
                    </div>
                </div>
            );
        };
        const FilterOverlay = () => {
            const navigate = useNavigate();
            return (
                <BottomSheet onClose={() => navigate(-1)}>
                    <div className="p-6 space-y-4">
                        <div className="flex justify-between items-center pb-2">
                            <button onClick={() => navigate(-1)} className="text-on-surface-variant font-medium">{t('cancel')}</button>
                            <h2 className="font-bold text-lg">Filter Inbox</h2>
                            <button className="text-primary font-bold">Reset</button>
                        </div>
                        <div className="space-y-2">
                            {['Attribute', 'Assignee', 'Team', 'Tags'].map((o, i) => (
                                <Link key={i} to={`/${o.toLowerCase().replace(' ', '-')}`} className="flex items-center justify-between p-4 bg-surface-container-low rounded-xl active:bg-gray-200">
                                    <span className="font-medium">{o}</span>
                                    <span className="material-symbols-outlined text-outline-variant">chevron_right</span>
                                </Link>
                            ))}
                        </div>
                        <button onClick={() => navigate(-1)} className="w-full bg-primary text-white py-4 rounded-2xl font-bold shadow-lg">Apply Filters</button>
                    </div>
                </BottomSheet>
            );
        };

        // --- Main App Wrapper ---

        const App = () => {
            const navigate = useNavigate();
            return (
                <div className="app-container">
                    <Routes>
                        <Route path="/" element={<SplashScreen />} />
                        <Route path="/landing" element={<LandingPage />} />
                        <Route path="/login" element={<LoginPage />} />
                        <Route path="/signup" element={<SignupPage />} />
                        <Route path="/inbox" element={<InboxPage />} />
                        <Route path="/chat/:id" element={<ChatScreen />} />
                        <Route path="/chat" element={<ChatScreen />} />
                        <Route path="/contacts" element={<ContactsPage />} />
                        <Route path="/create-contact" element={<div className="h-full relative"><ContactsPage /><CreateContactSheet /></div>} />
                        <Route path="/contact-details/:id" element={<ContactDetails />} />
                        <Route path="/contact-details" element={<ContactDetails />} />
                        <Route path="/advanced" element={<AdvancedPage />} />
                        <Route path="/settings" element={<SettingsPage />} />
                        <Route path="/language" element={<LanguagePage />} />
                        <Route path="/automations" element={<AutomationsPage />} />
                        <Route path="/timezone" element={<TimezonePage />} />
                        <Route path="/working-hours" element={<WorkingHoursPage />} />
                        <Route path="/holiday-mode" element={<HolidayModeScreen />} />
                        <Route path="/expired-chat" element={<AutoReplyScreen title="Expired or Closed Chat" type="expired_chat" />} />
                        <Route path="/advanced-ooo" element={<AutoReplyScreen title="Advanced Out of Office" type="advanced_ooo" />} />
                        <Route path="/ooo-settings" element={<AutoReplyScreen title="Out of Office" type="ooo" />} />
                        <Route path="/welcome-settings" element={<AutoReplyScreen title="Welcome Message" type="welcome" />} />
                        <Route path="/working-hours-reply-settings" element={<AutoReplyScreen title="Working Hours Message" type="working_hours" />} />
                        <Route path="/sort" element={<SortOverlay />} />
                        <Route path="/filter" element={<FilterOverlay />} />
                        <Route path="/chat-options/:id" element={<ChatOptionsScreen />} />
                        <Route path="/assign-team/:id" element={<AssignTeamScreen />} />
                        <Route path="/submit-as/:id" element={<SubmitAsScreen />} />
                        <Route path="/view-tags/:id" element={<ViewTagsScreen />} />
                        <Route path="/attribute" element={<div className="absolute inset-0 bg-surface flex flex-col z-[70] animate-slide-up"><div onClick={() => navigate(-1)} className="w-full flex justify-center py-3 cursor-pointer group bg-surface border-b border-gray-100"><div className="w-10 h-1.5 bg-gray-300 rounded-full group-hover:bg-gray-400 transition-colors"></div></div><header className="px-6 h-16 flex items-center gap-4 bg-[#f3fcef]/80 backdrop-blur-md border-b border-gray-100"><button onClick={() => navigate(-1)} className="text-primary flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100"><span className="material-symbols-outlined">arrow_back</span></button><h1 className="font-bold text-lg text-primary">Select Attribute</h1></header><main className="p-6 space-y-4">{['Location', 'Industry', 'Company Size'].map(t => (<button key={t} onClick={() => navigate(-1)} className="w-full text-left p-4 bg-white rounded-xl font-medium shadow-sm active:bg-gray-100">{t}</button>))}</main></div>} />
                        <Route path="/assignee" element={<div className="absolute inset-0 bg-surface flex flex-col z-[70] animate-slide-up"><div onClick={() => navigate(-1)} className="w-full flex justify-center py-3 cursor-pointer group bg-surface border-b border-gray-100"><div className="w-10 h-1.5 bg-gray-300 rounded-full group-hover:bg-gray-400 transition-colors"></div></div><header className="px-6 h-16 flex items-center gap-4 bg-[#f3fcef]/80 backdrop-blur-md border-b border-gray-100"><button onClick={() => navigate(-1)} className="text-primary flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100"><span className="material-symbols-outlined">arrow_back</span></button><h1 className="font-bold text-lg text-primary">Select Assignee</h1></header><main className="p-6 space-y-4">{['Sophiya', 'Michael', 'Unassigned'].map(t => (<button key={t} onClick={() => navigate(-1)} className="w-full text-left p-4 bg-white rounded-xl font-medium shadow-sm active:bg-gray-100">{t}</button>))}</main></div>} />
                        <Route path="/team" element={<div className="absolute inset-0 bg-surface flex flex-col z-[70] animate-slide-up"><div onClick={() => navigate(-1)} className="w-full flex justify-center py-3 cursor-pointer group bg-surface border-b border-gray-100"><div className="w-10 h-1.5 bg-gray-300 rounded-full group-hover:bg-gray-400 transition-colors"></div></div><header className="px-6 h-16 flex items-center gap-4 bg-[#f3fcef]/80 backdrop-blur-md border-b border-gray-100"><button onClick={() => navigate(-1)} className="text-primary flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100"><span className="material-symbols-outlined">arrow_back</span></button><h1 className="font-bold text-lg text-primary">Select Team</h1></header><main className="p-6 space-y-4">{['General', 'Escalations', 'VIP'].map(t => (<button key={t} onClick={() => navigate(-1)} className="w-full text-left p-4 bg-white rounded-xl font-medium shadow-sm active:bg-gray-100">{t}</button>))}</main></div>} />
                        <Route path="/tags" element={<div className="absolute inset-0 bg-surface flex flex-col z-[70] animate-slide-up"><div onClick={() => navigate(-1)} className="w-full flex justify-center py-3 cursor-pointer group bg-surface border-b border-gray-100"><div className="w-10 h-1.5 bg-gray-300 rounded-full group-hover:bg-gray-400 transition-colors"></div></div><header className="px-6 h-16 flex items-center gap-4 bg-[#f3fcef]/80 backdrop-blur-md border-b border-gray-100"><button onClick={() => navigate(-1)} className="text-primary flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-100"><span className="material-symbols-outlined">arrow_back</span></button><h1 className="font-bold text-lg text-primary">Select Tags</h1></header><main className="p-6 space-y-4">{['Tag 1', 'Tag 2', 'Tag 3'].map(t => (<button key={t} onClick={() => navigate(-1)} className="w-full text-left p-4 bg-white rounded-xl font-medium shadow-sm active:bg-gray-100">{t}</button>))}</main></div>} />
                    </Routes>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(
            <BrowserRouter>
                <App />
            </BrowserRouter>
        );
    </script>
</body>

</html>
